openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Kanban board todo tracker API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: boards
    description: Board workspace operations
  - name: users
    description: User listing for sharing
  - name: columns
    description: Board column operations
  - name: tasks
    description: Task card operations
  - name: teams
    description: Team workspace operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /boards:
    get:
      operationId: listBoards
      tags: [boards]
      summary: List boards accessible to the current user
      responses:
        "200":
          description: List of boards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Board"
    post:
      operationId: createBoard
      tags: [boards]
      summary: Create a new board
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BoardInput"
      responses:
        "201":
          description: Created board
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Board"

  /boards/{id}:
    patch:
      operationId: updateBoard
      tags: [boards]
      summary: Rename a board (owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BoardUpdate"
      responses:
        "200":
          description: Updated board
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Board"
        "403":
          description: Forbidden
        "404":
          description: Not found
    delete:
      operationId: deleteBoard
      tags: [boards]
      summary: Delete a board (owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "403":
          description: Forbidden
        "404":
          description: Not found

  /boards/{id}/members:
    get:
      operationId: listBoardMembers
      tags: [boards]
      summary: List board members
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Board members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BoardMember"
        "404":
          description: Not found
    post:
      operationId: addBoardMember
      tags: [boards]
      summary: Share board with a user (owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BoardMemberInput"
      responses:
        "201":
          description: Member added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardMember"
        "403":
          description: Forbidden
        "404":
          description: User not found

  /boards/{id}/members/{userId}:
    delete:
      operationId: removeBoardMember
      tags: [boards]
      summary: Remove a board member (owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed
        "403":
          description: Forbidden
        "404":
          description: Not found

  /teams:
    get:
      operationId: listTeams
      tags: [teams]
      summary: List teams for the current user
      responses:
        "200":
          description: List of teams
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Team"
    post:
      operationId: createTeam
      tags: [teams]
      summary: Create a team
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamInput"
      responses:
        "201":
          description: Created team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"

  /teams/{id}:
    patch:
      operationId: updateTeam
      tags: [teams]
      summary: Update a team (owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamUpdate"
      responses:
        "200":
          description: Updated team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "403":
          description: Forbidden
        "404":
          description: Not found
    delete:
      operationId: deleteTeam
      tags: [teams]
      summary: Delete a team (owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "403":
          description: Forbidden
        "404":
          description: Not found

  /teams/{id}/members:
    get:
      operationId: listTeamMembers
      tags: [teams]
      summary: List team members
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Team members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamMember"
        "404":
          description: Not found

  /teams/{id}/invites:
    get:
      operationId: listTeamInvites
      tags: [teams]
      summary: List pending team invites (owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Pending invites
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamInvite"
        "403":
          description: Forbidden
        "404":
          description: Not found
    post:
      operationId: inviteTeamMember
      tags: [teams]
      summary: Invite a user to a team (owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamInviteInput"
      responses:
        "201":
          description: Invite sent or member added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamInviteResult"
        "403":
          description: Forbidden
        "404":
          description: Not found

  /teams/{id}/members/{userId}:
    delete:
      operationId: removeTeamMember
      tags: [teams]
      summary: Remove a team member (owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed
        "403":
          description: Forbidden
        "404":
          description: Not found

  /teams/{id}/invites/{inviteId}:
    delete:
      operationId: cancelTeamInvite
      tags: [teams]
      summary: Cancel a pending invite (owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: inviteId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Cancelled
        "403":
          description: Forbidden
        "404":
          description: Not found

  /boards/{boardId}/team:
    get:
      operationId: getBoardTeam
      tags: [teams]
      summary: Get the team linked to a board
      parameters:
        - name: boardId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Linked team with members
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/BoardTeam"
                  - type: "null"
        "404":
          description: Not found

  /columns:
    get:
      operationId: listColumns
      tags: [columns]
      summary: List all columns for a board
      parameters:
        - name: boardId
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of columns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Column"
    post:
      operationId: createColumn
      tags: [columns]
      summary: Create a column
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ColumnInput"
      responses:
        "201":
          description: Created column
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Column"

  /columns/{id}:
    patch:
      operationId: updateColumn
      tags: [columns]
      summary: Update a column
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ColumnUpdate"
      responses:
        "200":
          description: Updated column
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Column"
        "404":
          description: Not found
    delete:
      operationId: deleteColumn
      tags: [columns]
      summary: Delete a column
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List all tasks
      parameters:
        - name: boardId
          in: query
          required: true
          schema:
            type: integer
        - name: columnId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Create a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /tasks/stats:
    get:
      operationId: getTaskStats
      tags: [tasks]
      summary: Get task statistics for a board
      parameters:
        - name: boardId
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Task stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskStats"

  /tasks/{id}:
    get:
      operationId: getTask
      tags: [tasks]
      summary: Get a task by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Not found
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Update a task (including moving between columns)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Not found
    delete:
      operationId: deleteTask
      tags: [tasks]
      summary: Delete a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /tasks/attachments/config:
    get:
      operationId: getAttachmentConfig
      tags: [tasks]
      summary: Get task attachment upload configuration and limits
      responses:
        "200":
          description: Attachment config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentConfig"

  /tasks/{id}/attachments:
    get:
      operationId: listTaskAttachments
      tags: [tasks]
      summary: List all attachments for a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of attachments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskAttachment"
        "404":
          description: Task or board not found
    post:
      operationId: uploadTaskAttachment
      tags: [tasks]
      summary: Upload an attachment for a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Attachment uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskAttachment"
        "400":
          description: Bad request
        "403":
          description: Forbidden
        "404":
          description: Task or board not found

  /tasks/{id}/attachments/{attachmentId}:
    delete:
      operationId: deleteTaskAttachment
      tags: [tasks]
      summary: Delete a task attachment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: attachmentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Attachment deleted
        "403":
          description: Forbidden
        "404":
          description: Attachment not found

  /tasks/{id}/attachments/{attachmentId}/download:
    get:
      operationId: downloadTaskAttachment
      tags: [tasks]
      summary: Download a task attachment file
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: attachmentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: File download
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "403":
          description: Forbidden
        "404":
          description: Attachment not found

  /tasks/{id}/comments:
    get:
      operationId: listTaskComments
      tags: [tasks]
      summary: List all comments for a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskComment"
        "404":
          description: Task or board not found
    post:
      operationId: createTaskComment
      tags: [tasks]
      summary: Add a comment to a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCommentInput"
      responses:
        "201":
          description: Comment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskComment"
        "400":
          description: Bad request
        "403":
          description: Forbidden
        "404":
          description: Task or board not found

  /tasks/{id}/comments/{commentId}:
    patch:
      operationId: updateTaskComment
      tags: [tasks]
      summary: Update a comment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: commentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCommentInput"
      responses:
        "200":
          description: Updated comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskComment"
        "400":
          description: Bad request
        "403":
          description: Forbidden
        "404":
          description: Not found
    delete:
      operationId: deleteTaskComment
      tags: [tasks]
      summary: Delete a comment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: commentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Comment deleted
        "403":
          description: Forbidden
        "404":
          description: Not found

  /tasks/{id}/activities:
    get:
      operationId: listTaskActivities
      tags: [tasks]
      summary: List all activity history for a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of activities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskActivity"
        "404":
          description: Task or board not found

  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List all notifications for the authenticated user
      parameters:
        - name: unreadOnly
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: List of notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
        "401":
          description: Unauthorized

  /notifications/unread-count:
    get:
      operationId: getUnreadNotificationsCount
      tags: [notifications]
      summary: Get count of unread notifications
      responses:
        "200":
          description: Unread notifications count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnreadNotificationsCount"
        "401":
          description: Unauthorized

  /notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark all unread notifications as read
      responses:
        "200":
          description: All notifications marked as read
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        "401":
          description: Unauthorized

  /notifications/{id}/read:
    patch:
      operationId: updateNotificationReadStatus
      tags: [notifications]
      summary: Mark a single notification as read or unread
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationUpdateInput"
      responses:
        "200":
          description: Notification updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "401":
          description: Unauthorized
        "404":
          description: Notification not found

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Board:
      type: object
      required: [id, name, key, isOwner, isShared, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        key:
          type: string
        isOwner:
          type: boolean
        isShared:
          type: boolean
        createdAt:
          type: string

    BoardInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        key:
          type: string

    BoardUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        key:
          type: string

    BoardMember:
      type: object
      required: [userId, email, isOwner]
      properties:
        userId:
          type: integer
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        isOwner:
          type: boolean

    BoardMemberInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    Column:
      type: object
      required: [id, title, position, createdAt]
      properties:
        id:
          type: integer
        title:
          type: string
        color:
          type: ["string", "null"]
        position:
          type: integer
        createdAt:
          type: string

    ColumnInput:
      type: object
      required: [title, boardId]
      properties:
        title:
          type: string
          minLength: 1
        boardId:
          type: integer
        color:
          type: string
        position:
          type: integer

    ColumnUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        color:
          type: ["string", "null"]
        position:
          type: integer

    Task:
      type: object
      required: [id, title, columnId, priority, position, createdAt]
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: ["string", "null"]
        columnId:
          type: integer
        priority:
          type: string
          enum: [low, medium, high]
        position:
          type: integer
        dueDate:
          type: ["string", "null"]
        assigneeId:
          type: ["integer", "null"]
        assignee:
          oneOf:
            - $ref: "#/components/schemas/Assignee"
            - type: "null"
        taskNumber:
          type: integer
        taskKey:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string

    TaskInput:
      type: object
      required: [title, columnId, boardId]
      properties:
        title:
          type: string
          minLength: 1
        boardId:
          type: integer
        description:
          type: string
        columnId:
          type: integer
        priority:
          type: string
          enum: [low, medium, high]
          default: medium
        position:
          type: integer
        dueDate:
          type: string
        assigneeId:
          type: integer

    TaskUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: ["string", "null"]
        columnId:
          type: integer
        priority:
          type: string
          enum: [low, medium, high]
        position:
          type: integer
        dueDate:
          type: ["string", "null"]
        assigneeId:
          type: ["integer", "null"]

    TaskStats:
      type: object
      required: [total, byColumn, byPriority, overdue]
      properties:
        total:
          type: integer
        overdue:
          type: integer
        byColumn:
          type: array
          items:
            type: object
            required: [columnId, columnTitle, count]
            properties:
              columnId:
                type: integer
              columnTitle:
                type: string
              count:
                type: integer
        byPriority:
          type: object
          required: [low, medium, high]
          properties:
            low:
              type: integer
            medium:
              type: integer
            high:
              type: integer

    Assignee:
      type: object
      required: [id, firstName, lastName]
      properties:
        id:
          type: integer
        firstName:
          type: string
        lastName:
          type: string

    Team:
      type: object
      required: [id, name, isOwner, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        boardId:
          type: ["integer", "null"]
        boardName:
          type: ["string", "null"]
        isOwner:
          type: boolean
        createdAt:
          type: string

    TeamInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1

    TeamUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
