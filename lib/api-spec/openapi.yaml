openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Kanban board todo tracker API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: boards
    description: Board workspace operations
  - name: users
    description: User listing for sharing
  - name: columns
    description: Board column operations
  - name: tasks
    description: Task card operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /boards:
    get:
      operationId: listBoards
      tags: [boards]
      summary: List boards accessible to the current user
      responses:
        "200":
          description: List of boards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Board"
    post:
      operationId: createBoard
      tags: [boards]
      summary: Create a new board
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BoardInput"
      responses:
        "201":
          description: Created board
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Board"

  /boards/{id}:
    patch:
      operationId: updateBoard
      tags: [boards]
      summary: Rename a board (owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BoardUpdate"
      responses:
        "200":
          description: Updated board
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Board"
        "403":
          description: Forbidden
        "404":
          description: Not found
    delete:
      operationId: deleteBoard
      tags: [boards]
      summary: Delete a board (owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "403":
          description: Forbidden
        "404":
          description: Not found

  /boards/{id}/members:
    get:
      operationId: listBoardMembers
      tags: [boards]
      summary: List board members
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Board members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BoardMember"
        "404":
          description: Not found
    post:
      operationId: addBoardMember
      tags: [boards]
      summary: Share board with a user (owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BoardMemberInput"
      responses:
        "201":
          description: Member added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardMember"
        "403":
          description: Forbidden
        "404":
          description: Not found

  /boards/{id}/members/{userId}:
    delete:
      operationId: removeBoardMember
      tags: [boards]
      summary: Remove a board member (owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed
        "403":
          description: Forbidden
        "404":
          description: Not found

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List other users in the system
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserSummary"

  /columns:
    get:
      operationId: listColumns
      tags: [columns]
      summary: List all columns for a board
      parameters:
        - name: boardId
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of columns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Column"
    post:
      operationId: createColumn
      tags: [columns]
      summary: Create a column
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ColumnInput"
      responses:
        "201":
          description: Created column
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Column"

  /columns/{id}:
    patch:
      operationId: updateColumn
      tags: [columns]
      summary: Update a column
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ColumnUpdate"
      responses:
        "200":
          description: Updated column
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Column"
        "404":
          description: Not found
    delete:
      operationId: deleteColumn
      tags: [columns]
      summary: Delete a column
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List all tasks
      parameters:
        - name: boardId
          in: query
          required: true
          schema:
            type: integer
        - name: columnId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Create a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /tasks/stats:
    get:
      operationId: getTaskStats
      tags: [tasks]
      summary: Get task statistics for a board
      parameters:
        - name: boardId
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Task stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskStats"

  /tasks/{id}:
    get:
      operationId: getTask
      tags: [tasks]
      summary: Get a task by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Not found
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Update a task (including moving between columns)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Not found
    delete:
      operationId: deleteTask
      tags: [tasks]
      summary: Delete a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Board:
      type: object
      required: [id, name, isOwner, isShared, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        isOwner:
          type: boolean
        isShared:
          type: boolean
        createdAt:
          type: string

    BoardInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1

    BoardUpdate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1

    BoardMember:
      type: object
      required: [userId, email, isOwner]
      properties:
        userId:
          type: integer
        email:
          type: string
        isOwner:
          type: boolean

    BoardMemberInput:
      type: object
      required: [userId]
      properties:
        userId:
          type: integer

    UserSummary:
      type: object
      required: [id, email]
      properties:
        id:
          type: integer
        email:
          type: string

    Column:
      type: object
      required: [id, title, position, createdAt]
      properties:
        id:
          type: integer
        title:
          type: string
        color:
          type: ["string", "null"]
        position:
          type: integer
        createdAt:
          type: string

    ColumnInput:
      type: object
      required: [title, boardId]
      properties:
        title:
          type: string
          minLength: 1
        boardId:
          type: integer
        color:
          type: string
        position:
          type: integer

    ColumnUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        color:
          type: ["string", "null"]
        position:
          type: integer

    Task:
      type: object
      required: [id, title, columnId, priority, position, createdAt]
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: ["string", "null"]
        columnId:
          type: integer
        priority:
          type: string
          enum: [low, medium, high]
        position:
          type: integer
        dueDate:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string

    TaskInput:
      type: object
      required: [title, columnId, boardId]
      properties:
        title:
          type: string
          minLength: 1
        boardId:
          type: integer
        description:
          type: string
        columnId:
          type: integer
        priority:
          type: string
          enum: [low, medium, high]
          default: medium
        position:
          type: integer
        dueDate:
          type: string

    TaskUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: ["string", "null"]
        columnId:
          type: integer
        priority:
          type: string
          enum: [low, medium, high]
        position:
          type: integer
        dueDate:
          type: ["string", "null"]

    TaskStats:
      type: object
      required: [total, byColumn, byPriority, overdue]
      properties:
        total:
          type: integer
        overdue:
          type: integer
        byColumn:
          type: array
          items:
            type: object
            required: [columnId, columnTitle, count]
            properties:
              columnId:
                type: integer
              columnTitle:
                type: string
              count:
                type: integer
        byPriority:
          type: object
          required: [low, medium, high]
          properties:
            low:
              type: integer
            medium:
              type: integer
            high:
              type: integer
