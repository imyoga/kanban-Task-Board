openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Kanban board todo tracker API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: columns
    description: Board column operations
  - name: tasks
    description: Task card operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /columns:
    get:
      operationId: listColumns
      tags: [columns]
      summary: List all columns
      responses:
        "200":
          description: List of columns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Column"
    post:
      operationId: createColumn
      tags: [columns]
      summary: Create a column
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ColumnInput"
      responses:
        "201":
          description: Created column
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Column"

  /columns/{id}:
    patch:
      operationId: updateColumn
      tags: [columns]
      summary: Update a column
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ColumnUpdate"
      responses:
        "200":
          description: Updated column
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Column"
        "404":
          description: Not found
    delete:
      operationId: deleteColumn
      tags: [columns]
      summary: Delete a column
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List all tasks
      parameters:
        - name: columnId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Create a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /tasks/stats:
    get:
      operationId: getTaskStats
      tags: [tasks]
      summary: Get task statistics
      responses:
        "200":
          description: Task stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskStats"

  /tasks/{id}:
    get:
      operationId: getTask
      tags: [tasks]
      summary: Get a task by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Not found
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Update a task (including moving between columns)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Not found
    delete:
      operationId: deleteTask
      tags: [tasks]
      summary: Delete a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Column:
      type: object
      required: [id, title, position, createdAt]
      properties:
        id:
          type: integer
        title:
          type: string
        color:
          type: ["string", "null"]
        position:
          type: integer
        createdAt:
          type: string

    ColumnInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
        color:
          type: string
        position:
          type: integer

    ColumnUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        color:
          type: ["string", "null"]
        position:
          type: integer

    Task:
      type: object
      required: [id, title, columnId, priority, position, createdAt]
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: ["string", "null"]
        columnId:
          type: integer
        priority:
          type: string
          enum: [low, medium, high]
        position:
          type: integer
        dueDate:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string

    TaskInput:
      type: object
      required: [title, columnId]
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        columnId:
          type: integer
        priority:
          type: string
          enum: [low, medium, high]
          default: medium
        position:
          type: integer
        dueDate:
          type: string

    TaskUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: ["string", "null"]
        columnId:
          type: integer
        priority:
          type: string
          enum: [low, medium, high]
        position:
          type: integer
        dueDate:
          type: ["string", "null"]

    TaskStats:
      type: object
      required: [total, byColumn, byPriority, overdue]
      properties:
        total:
          type: integer
        overdue:
          type: integer
        byColumn:
          type: array
          items:
            type: object
            required: [columnId, columnTitle, count]
            properties:
              columnId:
                type: integer
              columnTitle:
                type: string
              count:
                type: integer
        byPriority:
          type: object
          required: [low, medium, high]
          properties:
            low:
              type: integer
            medium:
              type: integer
            high:
              type: integer
